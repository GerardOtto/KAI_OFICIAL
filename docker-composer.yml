services:

  db:
    # La 18, la misma de integración continua: el volcado de datos lo generó
    # pg_dump 18 y usa órdenes que las versiones anteriores no entienden.
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      # Del archivo .env, como las claves del backend: una contraseña escrita
      # aquí queda publicada con el repositorio.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en un archivo .env junto a docker-composer.yml (ver README)}
      POSTGRES_DB: KAI-PROJECT
    volumes:
      # Desde la 18, la imagen guarda los datos en /var/lib/postgresql/18/docker y
      # pide montar el volumen un nivel más arriba.
      - postgres_data:/var/lib/postgresql
      # Esquema completo, con todas las migraciones aplicadas, y los datos
      # académicos, sin ninguna cuenta. Solo se carga con el volumen vacío, en
      # orden alfabético: primero los datos, después el rol del asistente, que
      # por ser del servidor no viaja en el volcado, y al final el puntaje total
      # de cada ranking (migración 020), que tampoco está en él.
      - ./backend/pruebas/datos_de_prueba.sql:/docker-entrypoint-initdb.d/01-datos.sql
      - ./backend/migraciones/019_rol_del_asistente.sql:/docker-entrypoint-initdb.d/02-rol-del-asistente.sql
      - ./backend/migraciones/020_puntaje_total.sql:/docker-entrypoint-initdb.d/03-puntaje-total.sql
      - ./backend/migraciones/021_gras_por_edicion.sql:/docker-entrypoint-initdb.d/04-gras-por-edicion.sql
    ports:
      - "5432:5432"
    healthcheck:
      # Por TCP y no por el socket: mientras carga el volcado, la imagen levanta
      # un servidor temporal que solo escucha por socket, y por ahí se daba por
      # lista una base todavía a medio cargar.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d KAI-PROJECT"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/KAI-PROJECT
      # Las claves salen del archivo .env junto a este, que no se versiona (ver
      # README). JWT_SECRET es obligatoria: sin ella todo /auth respondería 503,
      # así que el arranque se detiene antes con un aviso.
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en un archivo .env junto a docker-composer.yml (ver README)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/kai-project
      args:
        # Se incrusta al compilar, así que va como argumento de construcción. La
        # usa el navegador, no el contenedor: es la dirección publicada en el
        # equipo, no la de la red interna de Docker.
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
