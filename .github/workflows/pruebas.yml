name: Pruebas

# Ejecuta las baterías de verificación del backend en cada empuje y en cada
# solicitud de incorporación. Solo se ejecutan las que no llaman a ningún
# proveedor de lenguaje: las que sí lo hacen consumen cuota y credenciales, y se
# lanzan a mano (`python pruebas/ejecutar.py --en-vivo`).
#
# Las sondas de navegador no se incluyen aquí: necesitan la aplicación compilada
# y servida, y un navegador con el protocolo de depuración abierto. Se ejecutan a
# mano según `backend/pruebas/README.md`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Las pruebas solo leen el repositorio.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kai_pruebas
        ports: ["5432:5432"]
        # Sin esta comprobación el trabajo seguiría antes de que la base acepte
        # conexiones, y la restauración fallaría de forma intermitente.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kai_pruebas
      # Las baterías sustituyen el proveedor por un doble; las claves solo sirven
      # para que los motores figuren como configurados y nunca se usan.
      GEMINI_API_KEY: clave-de-prueba
      ANTHROPIC_API_KEY: clave-de-prueba
      JWT_SECRET: secreto-solo-para-pruebas

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # La batería `consultas-guiadas` genera los mensajes de los botones del
      # chat con el módulo del frontend que los construye, así que necesita Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: pip install -r tools/rankings/requirements.txt

      - name: Cargar los datos de prueba
        # El volcado trae el esquema completo y los datos académicos, sin ninguna
        # fila de las tablas de cuentas, conversaciones, mensajes ni
        # notificaciones. Ver backend/pruebas/README.md.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/pruebas/datos_de_prueba.sql

      - name: Aplicar las migraciones que el volcado no trae
        # El volcado llega hasta la 017, como la base de producción antes de esta
        # versión. Se aplican de la 018 a la 024 en orden numérico, igual que en
        # Railway: la 018 tiene que ir antes que la 020 (fusiona UNIACC, y con los
        # totales ya calculados encontraría duplicados). La 019 crea el rol del
        # asistente, que es del servidor y no viaja en el volcado.
        run: |
          for m in 018_catalogo_de_universidades 019_rol_del_asistente 020_puntaje_total \
                   021_gras_por_edicion 022_grupos_de_comparacion 023_posicion_y_actualizacion 024_the_world; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "backend/migraciones/$m.sql"
          done

      - name: Ejecutar las baterías
        working-directory: backend
        run: python pruebas/ejecutar.py
